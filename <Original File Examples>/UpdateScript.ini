[Update Script]
1 Goto         = Set Ad Server Folder
2 Goto         = Run Updater If Old Name
3 Goto         = Update Client If Wrong Version


[Set Ad Server Folder]
Command        = SET VARIABLE TO VALUE
Variable       = AdServerFolder
Value          = bigidea/content/ads

[Run Updater If Old Name]
Command        = IF THIS LESSTHANOREQUALTO VERSION THEN GOTO
Version        = 1.0.0.60
Goto           = Run Cosmic Updater

[Update Client If Wrong Version]
Command        = IF THIS LESSTHANOREQUALTO VERSION THEN GOTO
Version        = 1.1.0.65
Goto           = Update Client


[Server Version Folders]
1.0.0.16       = bigidea/content/v1.1.0.65
1.0.0.60       = bigidea/content/v1.1.0.65
1.1.0.61       = bigidea/content/CosmicUpdater
1.1.0.65       = bigidea/content/v1.1.0.65


;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;;;;                                                                  ;;;;
;;;;                                                Run Cosmic Updater;;;;
;;;;                                                                  ;;;;
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

[Run Cosmic Updater]
1 Goto         = Cosmic Rename
2 Goto         = Stop Cosmic Rename

[Cosmic Rename]
Command        = UPDATE
Client Path    = BigIdeaClient.exe
File Size Bytes= 815406
Version        = 1.1.0.61
Group Priority = 0
Mandatory      = TRUE

[Stop Cosmic Rename]
Command        = STOP


;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;;;;                                                                  ;;;;
;;;;                                                Update Client     ;;;;
;;;;                                                                  ;;;;
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

[Update Client]
1 Goto         = Update Non-Debug Client EXE
;;;2 Goto         = If Debug Client EXE Exists
2 Goto         = Delete Old Client EXE
3 Goto         = Delete Debug Client EXE
4 Goto         = Delete beta Config.ini
5 Goto         = Update Resources


[Update Non-Debug Client EXE]
Command        = IF CLIENT_PATH NOTEQUALTO VERSION THEN UPDATE
Client Path    = CosmicConsensus.exe
File Size Bytes= 1372672
Version        = 1.1.0.65
Group Priority = 0
Mandatory      = TRUE

[If Debug Client EXE Exists]
Command        = IF CLIENT_PATH EXISTS THEN GOTO
Client Path    = CosmicConsensus(debug).exe
Goto           = Update Debug Client EXE

[Update Debug Client EXE]
Command        = IF CLIENT_PATH NOTEQUALTO VERSION THEN UPDATE
Client Path    = CosmicConsensus(debug).exe
File Size Bytes= 3641856
Version        = 1.1.0.65
Group Priority = 0
Mandatory      = TRUE

[Delete Old Client EXE]
Command        = DELETE
Client Path    = BigIdeaClient.exe

[Delete Debug Client EXE]
Command        = IF CLIENT_PATH EXISTS THEN DELETE
Client Path    = CosmicConsensus(debug).exe

[Delete beta Config.ini]
Command        = IF THIS EQUALTO VERSION THEN DELETE
Version        = 1.0.0.51
Client Path    = Config.ini


